name: room_temperature_app
description: Room Temperature — estimated indoor & outdoor temperature tracking
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  app_localization:
    path: ../../shared/app_localization
  auth_data:
    path: ../../features/auth/auth_data
  auth_domain:
    path: ../../features/auth/auth_domain
  auth_presentation:
    path: ../../features/auth/auth_presentation
  bloc: ^9.2.1
  firebase_auth: ^6.6.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  geolocator: ^14.0.3
  go_router: ^18.0.0
  history_data:
    path: ../../features/history/history_data
  history_domain:
    path: ../../features/history/history_domain
  history_presentation:
    path: ../../features/history/history_presentation
  home_widget_bridge:
    path: ../../shared/home_widget_bridge
  intl: ^0.20.2
  notifications_data:
    path: ../../features/notifications/notifications_data
  notifications_domain:
    path: ../../features/notifications/notifications_domain
  permission_handler: ^13.0.1
  provider: ^6.1.5+1
  settings_data:
    path: ../../features/settings/settings_data
  settings_domain:
    path: ../../features/settings/settings_domain
  settings_presentation:
    path: ../../features/settings/settings_presentation
  shared_preferences: ^2.5.5
  temperature_data:
    path: ../../features/temperature/temperature_data
  temperature_domain:
    path: ../../features/temperature/temperature_domain
  temperature_presentation:
    path: ../../features/temperature/temperature_presentation
  ui_kit:
    path: ../../shared/ui_kit
  workmanager: ^0.10.9

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.4.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    # Weather backdrops. The directory ships with only a README today —
    # WeatherBackdrop falls back to a gradient per condition until real
    # photographs are dropped in. See the README for filenames.
    - assets/backgrounds/
